# golangci-lint v2, pinned in tools/go.mod: go tool -modfile=tools/go.mod golangci-lint run
# CI runs it in the go job; it is too heavy for a pre-push hook.
version: '2'

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - depguard
    - gosec
    - nolintlint
  settings:
    errcheck:
      # a reply the peer may no longer read is best effort: the connection's
      # own read or close reports the failure
      exclude-functions:
        - (*github.com/zgeoff/impz/agent/internal/proto.Writer).Write
        - (*github.com/zgeoff/impz/agent/internal/proto.Writer).WriteMessage
        - github.com/zgeoff/impz/agent/internal/proto.ReplyError
    gosec:
      excludes:
        # errcheck checks unhandled errors
        - G104
        # integer conversions at the syscall and wire boundaries, where the
        # kernel or the protocol bounds the value
        - G115
        # the agent runs the commands the host asks for
        - G204
        # the agent makes directories and files that the user and the kernel
        # read: cgroupfs, /proc/sys, the container's mounts
        - G301
        - G306
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      # a new dependency is a change to this list
      rules:
        main:
          allow:
            - $gostd
            - github.com/zgeoff/impz/agent
            - github.com/charmbracelet/x/ansi
            - github.com/mdlayher/vsock
            - github.com/moby/sys/user
            - github.com/pkg/sftp
            - github.com/vishvananda/netlink
            - golang.org/x/sys
            - google.golang.org/protobuf
            - gotest.tools/v3
        # the agent's layers from the bottom up, one folder each under
        # internal/: base (with proto, whose path the generated code fixes),
        # host, feature, server, then boot. A package imports only its own
        # layer and the layers below it. A folder's trailing slash keeps its
        # rule off a package whose name only starts with the folder's.
        layer-base:
          files:
            - '**/internal/proto/*.go'
            - '**/internal/base/**'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/host/
              desc: the host layer sits above the base layer
            - pkg: github.com/zgeoff/impz/agent/internal/feature/
              desc: the feature layer sits above the base layer
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the base layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the base layer
        layer-host:
          files:
            - '**/internal/host/**'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/feature/
              desc: the feature layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the host layer
        layer-feature:
          files:
            - '**/internal/feature/**'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the feature layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the feature layer
        layer-server:
          files:
            - '**/internal/server/**'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the server layer
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # a test fails on what it checks; its cleanup and fixtures are best effort
      - path: _test\.go
        linters: [errcheck, gosec]
