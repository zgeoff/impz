# golangci-lint v2, pinned in tools/go.mod: go tool -modfile=tools/go.mod golangci-lint run
# CI runs it in the go job; it is too heavy for a pre-push hook.
version: '2'

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - depguard
    - gosec
    - nolintlint
  settings:
    errcheck:
      # a reply the peer may no longer read is best effort: the connection's
      # own read or close reports the failure
      exclude-functions:
        - (*github.com/zgeoff/impz/agent/internal/proto.Writer).Write
        - (*github.com/zgeoff/impz/agent/internal/proto.Writer).WriteMessage
        - github.com/zgeoff/impz/agent/internal/proto.ReplyError
    gosec:
      excludes:
        # errcheck checks unhandled errors
        - G104
        # integer conversions at the syscall and wire boundaries, where the
        # kernel or the protocol bounds the value
        - G115
        # the agent runs the commands the host asks for
        - G204
        # the agent makes directories and files that the user and the kernel
        # read: cgroupfs, /proc/sys, the container's mounts
        - G301
        - G306
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      # a new dependency is a change to this list
      rules:
        main:
          allow:
            - $gostd
            - github.com/zgeoff/impz/agent
            - github.com/charmbracelet/x/ansi
            - github.com/mdlayher/vsock
            - github.com/moby/sys/user
            - github.com/pkg/sftp
            - github.com/vishvananda/netlink
            - golang.org/x/sys
            - google.golang.org/protobuf
            - gotest.tools/v3
        # the agent's layers from the bottom up: the wire and the reaper, the
        # host helpers, the features, the server, then boot. A package imports
        # only its own layer and the layers below it.
        layer-wire:
          files:
            - '**/internal/proto/*.go'
            - '**/internal/safe/*.go'
            - '**/internal/reaper/*.go'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/proc
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/fsroot
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/pty
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/cgroup
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/cmdline
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/imagecfg
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/netcfg
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/disk
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/dropcaps
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/sysutil
              desc: the host layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/inner
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/launch
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/dial
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/listen
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/exec
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/session
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/services
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/outer
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/tartool
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/sftpserver
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/files
              desc: the features layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the wire layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the wire layer
        layer-host:
          files:
            - '**/internal/proc/*.go'
            - '**/internal/fsroot/*.go'
            - '**/internal/pty/*.go'
            - '**/internal/cgroup/*.go'
            - '**/internal/cmdline/*.go'
            - '**/internal/imagecfg/*.go'
            - '**/internal/netcfg/*.go'
            - '**/internal/disk/*.go'
            - '**/internal/dropcaps/*.go'
            - '**/internal/sysutil/*.go'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/inner
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/launch
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/dial
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/listen
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/exec
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/session
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/services
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/outer
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/tartool
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/sftpserver
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/files
              desc: the features layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the host layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the host layer
        layer-features:
          files:
            - '**/internal/inner/*.go'
            - '**/internal/launch/*.go'
            - '**/internal/dial/*.go'
            - '**/internal/listen/*.go'
            - '**/internal/exec/*.go'
            - '**/internal/session/*.go'
            - '**/internal/services/*.go'
            - '**/internal/outer/*.go'
            - '**/internal/tartool/*.go'
            - '**/internal/sftpserver/*.go'
            - '**/internal/files/*.go'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/server
              desc: the server layer sits above the features layer
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the features layer
        layer-server:
          files:
            - '**/internal/server/*.go'
          deny:
            - pkg: github.com/zgeoff/impz/agent/internal/boot
              desc: the boot layer sits above the server layer
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # a test fails on what it checks; its cleanup and fixtures are best effort
      - path: _test\.go
        linters: [errcheck, gosec]
