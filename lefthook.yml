# Git hooks. pre-commit fixes staged files only (fast); pre-push comes from
# the chex baseline, which runs its jobs one at a time and lints and tests
# only what the branch changes. CI runs every whole-tree check.

extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: &chex-baseline |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '**/dist/**'
        - 'dist/**'
        - '**/coverage/**'
        - 'coverage/**'
        - 'kernel/out/**'
        - '.cache/**'
        - '.claude/**'
        - 'packages/daemon/src/platform/db/schema.ts'
        - 'packages/agent-protocol/src/gen/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # the style scripts/ci/shellcheck.sh checks, from .editorconfig; needs shfmt on PATH, the
    # version CI pins (3.14.1). Scripts without a .sh name (scripts/impz,
    # host/entrypoint) are left to that check. repo-sync owns the scripts under
    # .claude/skills/, so the hook leaves them as zgeoff/tools formats them.
    - name: shfmt
      glob: '*.sh'
      exclude:
        - '.claude/skills/**'
      run: shfmt -w {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

# imp's own pre-push jobs; they run before the baseline's
pre-push:
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: *chex-baseline
    - name: lint:docs
      run: bun run lint:docs
    - name: lint:images
      run: bun run lint:images
    - name: lint:workflows
      run: bun run lint:workflows
    # needs shellcheck on PATH, the version CI pins (0.11.0)
    - name: lint:shell
      run: bun run lint:shell
    # the shell that production code holds as text; needs shellcheck too
    - name: lint:embedded-shell
      run: bun run --silent ci:check-embedded-shell
    # needs ruby on PATH, so it runs only on a branch that changes the formula
    - name: lint:formula
      files:
        &branch-files unset $(git rev-parse --local-env-vars); bun "$(git rev-parse
        --show-toplevel)/node_modules/@zgeoff/chex/src/read-branch-files.ts"
      glob: 'scripts/release/build-formula.sh'
      run: bun run lint:formula
    # the agent's gofmt and vet, on a branch that changes its Go; -p 1 keeps
    # vet to about 335 MB cold. golangci-lint, govulncheck, deadcode and the
    # race tests are CI's alone: each needs more than a 2 GB imp can spare.
    - name: go:fmt-vet
      files: *branch-files
      glob: 'agent/**/*.go'
      root: agent/
      run: test -z "$(gofmt -l {files})" && go vet -p 1 ./...
    - name: go:fmt-vet-ksm-exec
      files: *branch-files
      glob:
        - 'host/ksm-exec/*.go'
        - 'host/ksm-exec/**/*.go'
      root: host/ksm-exec/
      run: test -z "$(gofmt -l {files})" && go vet -p 1 ./...
    - name: go:fmt-vet-uffd-handler
      files: *branch-files
      glob:
        - 'host/uffd-handler/*.go'
        - 'host/uffd-handler/**/*.go'
      root: host/uffd-handler/
      run: test -z "$(gofmt -l {files})" && go vet -p 1 ./...
    - name: go:fmt-vet-oci-fetch
      files: *branch-files
      glob:
        - 'host/oci-fetch/*.go'
        - 'host/oci-fetch/**/*.go'
      root: host/oci-fetch/
      run: test -z "$(gofmt -l {files})" && go vet -p 1 ./...
    - name: go:fmt-vet-uffd-spike
      files: *branch-files
      glob:
        - 'docs/design/spikes/uffd-2m-restore/harness/*.go'
        - 'docs/design/spikes/uffd-2m-restore/harness/**/*.go'
      root: docs/design/spikes/uffd-2m-restore/harness/
      run: test -z "$(gofmt -l {files})" && go vet -p 1 ./...
