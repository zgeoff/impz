# zizmor's settings for the workflows and actions under .github/, which the
# shellcheck job in ci.yml audits.
rules:
  # every action and shared workflow stays pinned to a commit
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # audit-fix.yml starts on a failed workflow_run, but the reusable workflow
  # checks out only the default branch, never the run's head, so no pull
  # request's code runs with its token
  dangerous-triggers:
    ignore:
      - audit-fix.yml
  # the `uses: $/...` form this audit asks for fails actionlint 1.7.12, which
  # knows only `./...` for an action in this repository
  self-repository:
    disable: true
  # repo-sync pins each zgeoff/tools call to a commit with a `# main` comment,
  # which names a branch and matches no commit once main moves on; Renovate
  # keeps every other action's version comment in step with its hash
  ref-version-mismatch:
    disable: true
