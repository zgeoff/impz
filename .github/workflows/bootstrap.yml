name: Bootstrap

# Runs deploy/bootstrap.sh twice in a systemd container on Debian 13 and
# Ubuntu 24.04 and 26.04 (e2e/test-bootstrap.sh), and checks the second
# run changes nothing, on XFS and on a ZFS pool. A stand-in image replaces
# the release image, so the health check, which boots an imp, runs by hand:
# e2e/test-bootstrap.sh --image imp-host:<tag> --health. The bootstrap job
# is a required check in .github/rulesets/main.json: rename both together. It
# runs on every pull request, and skips its work, reporting success, unless the
# pull request changes a path that push lists below.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - deploy/**
      - e2e/test-bootstrap.*
      - packages/e2e-harness/src/bootstrap/**
      - packages/e2e-harness/src/read-pool-properties.ts
      - packages/test-utils/src/wait-for.ts
      - .bun-version
      - scripts/ci/check-kvm.sh
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the pull request changes the paths push lists; keep both lists
  # alike. This list adds the detector, so a change to it runs the work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Paths changed
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            deploy/**
            e2e/test-bootstrap.*
            packages/e2e-harness/src/bootstrap/**
            packages/e2e-harness/src/read-pool-properties.ts
            packages/test-utils/src/wait-for.ts
            .bun-version
            scripts/ci/check-kvm.sh
            .github/workflows/bootstrap.yml
            .github/actions/paths-changed/**

  # Only a 'false' skips it, so a failed changes job runs the work rather than
  # pass it.
  bootstrap:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bootstrap.sh refuses a host without KVM; fail here first, and clearly
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      # the ZFS leg makes a pool from the container, with this kernel's
      # module; zfs.ko sits in linux-modules-extra on some runner kernels
      - name: Load ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zfsutils-linux
          modinfo zfs >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe zfs
          cat /sys/module/zfs/version

      # the harness is TypeScript that e2e/test-bootstrap.sh runs with Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: e2e/test-bootstrap.sh --stub --zfs
