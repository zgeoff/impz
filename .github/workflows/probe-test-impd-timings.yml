name: probe test impd timings

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: perf/test-impd-template-db
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: entrypoint test on tmpfs
        run: |
          findmnt /dev/shm
          for i in 1 2 3 4 5 6 7 8; do
            scripts/ci/run-memory-capped.sh 1536 env TMPDIR=/dev/shm bun test host/entrypoint.test.ts 2>&1 | grep -E "\(fail\)| pass$| fail$|timed out" || true
          done
