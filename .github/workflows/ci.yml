name: CI

# The gates every change to main must pass, then the release on main. Each
# gate job is one required status check in .github/rulesets/main.json, so a
# gate's name is part of that contract: rename both together.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Each job sets its own concurrency group: a newer push to the same ref
# cancels the checks of the older run, and the release jobs never cancel.

env:
  # CI never commits, but skip hook install/execution regardless
  LEFTHOOK: 0

jobs:
  gitleaks:
    concurrency:
      group: ci-${{ github.ref }}-gitleaks
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # the scan reads every file of the commits it covers
          filter: ''

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  # The unit run, plain `bun test`, in two shards on two runners, each with two
  # workers: one Bun process over every file took about 6 minutes, the longest
  # job in the run. --no-isolate keeps one global per worker; four workers
  # outgrow the memory cap, and slow a CPU-bound property test past its time
  # limit. --timings splits the files by the per-file times in
  # scripts/ci/unit-test-timings.json, and a file it does not list still runs
  # in one shard. To refresh that file, merge the timings-*.json files of a
  # main run's unit-test-results artifacts:
  # jq -s '{version: 1, files: (map(.files) | add)}' timings-*.json
  checks-unit:
    concurrency:
      group: ci-${{ github.ref }}-unit-${{ matrix.shard }}
      cancel-in-progress: true
    name: checks (unit ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a healthy shard takes about 2.5 minutes
    timeout-minutes: 15
    strategy:
      # every shard reports, so one failure does not hide another's
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Make the results dir
        run: mkdir -p "$RUNNER_TEMP/unit-test"

      # this shard's files, in a cgroup capped below an imp's 2 GiB with no
      # swap, so a test fails here before it outgrows the imps it runs on; the
      # first --timings file starts empty and takes this shard's measured times.
      # The tests' temp dirs go on tmpfs, so a test impd's data dir and its
      # checkpoint copies never wait on the runner's disk; TMPDIR rides in the
      # command, because glibc drops it from the environment of setuid sudo
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          scripts/ci/run-memory-capped.sh 1536 env TMPDIR=/dev/shm bun test --parallel=2
          --no-isolate --shard="$SHARD/2" --timings="$RUNNER_TEMP/unit-test/timings-$SHARD.json"
          --timings=scripts/ci/unit-test-timings.json --update-timings --reporter=junit
          --reporter-outfile="$RUNNER_TEMP/unit-test/results-$SHARD.xml"

      # the per-file times and the JUnit report, for the timings refresh above
      # and the test budget audit
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-test/
          if-no-files-found: ignore
          retention-days: 14

  # The static gates, the generated code and the lane tests: every check but
  # the unit run.
  checks-lanes:
    concurrency:
      group: ci-${{ github.ref }}-lanes
      cancel-in-progress: true
    name: checks (lanes)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours; a healthy run takes about 3 minutes
    timeout-minutes: 15
    steps:
      # two commits, so Protocol Wire Format has main's schema to compare with
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Bun Pin
        run: scripts/ci/check-bun-pin.sh

      # the whole-tree gates: dead code, format, type-aware lint, doc links and
      # types, as package.json's check:static script lists them
      - name: Check
        run: bun run check:static

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bash .claude/skills/docs-writing/scripts/check-length.sh --package README.md

      # an image build's disk hold against what it really takes, the disk
      # sampler that measures it, and a moved disk's data blocks
      - name: Test Small Filesystem
        run: bun run --silent ci:small-fs-tests

      # impd's port of the Dockerfile parser against the Go parser it ports,
      # at the commit behind the pinned frontend (scripts/dockerfile-difftest)
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/dockerfile-difftest/go.mod
          cache-dependency-path: scripts/dockerfile-difftest/go.sum

      - name: Dockerfile Parser Diff
        run: bun scripts/dockerfile-difftest/run.ts --seed 1

      # the agent protocol's generated code and reference against its schema;
      # protoc-gen-go runs from the agent's go.mod, on that module's Go
      - name: Setup Go for the agent
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Generated Protocol Code
        run: bun run --silent ci:check-generated-protocol

      # buf.yaml's breaking rules (WIRE_JSON) against main: the first parent of
      # a pull request's merge commit, or of a squash merge pushed to main
      - name: Protocol Wire Format
        run: bun x buf breaking --against ".git#ref=$(git rev-parse HEAD^1)"

      # the ACME issuer against Pebble and challtestsrv in Docker
      - name: Test ACME
        run: bun run test:pebble

      # tailscale-up.sh joining Headscale in Docker with a tagged pre-auth key,
      # and the e2e harness's Headscale: its policy and its teardown
      - name: Test Headscale Join
        run: bun run test:headscale

      # the CLI's build context against what docker buildx sees in it
      - name: Test Docker Build
        run: bun run test:docker

      # its own run: the component tests register a DOM that must not reach
      # the daemon's tests (bunfig.toml pathIgnorePatterns)
      - name: Test Dashboard
        run: bun run test:dashboard

      - name: Build Dashboard
        run: bun run build:dashboard

  # The required check: both unit shards and the lanes job passed. It runs
  # whatever they did, so a job that failed, was cancelled or was skipped fails
  # it, and never passes as a skip.
  checks:
    concurrency:
      group: ci-${{ github.ref }}-checks
      cancel-in-progress: true
    if: always()
    needs: [checks-unit, checks-lanes]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the unit shards to pass
        env:
          RESULT: ${{ needs.checks-unit.result }}
        run: test "$RESULT" = success

      - name: Require the lanes to pass
        env:
          RESULT: ${{ needs.checks-lanes.result }}
        run: test "$RESULT" = success

  go:
    concurrency:
      group: ci-${{ github.ref }}-go
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.mod lives in agent/, so the version and the module cache key both
      # need pointing there; the key also covers the lint tools, ksm-exec,
      # oci-fetch, uffd-handler, the Dockerfile difftest module and the UFFD
      # spike's harness
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            agent/tools/go.sum
            host/ksm-exec/go.sum
            host/oci-fetch/go.sum
            host/uffd-handler/go.sum
            scripts/dockerfile-difftest/go.sum
            docs/design/spikes/uffd-2m-restore/harness/go.sum

      # the Go checks run from a script, which needs Bun and none of the
      # workspace's packages
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Format
        run: bun run --silent ci:go format

      - name: Vet
        run: bun run --silent ci:go vet

      - name: Lint
        run: bun run --silent ci:go lint

      - name: Vulnerabilities
        run: bun run --silent ci:go vulnerabilities

      - name: Dead Code
        run: bun run --silent ci:go deadcode

      - name: Test
        env:
          GO_TEST_JSONFILE: ${{ runner.temp }}/go-test.json
        run: bun run --silent ci:go test

      # last: the root-only tests leave root-owned files in the build cache
      - name: Test as root
        run: bun run --silent ci:go test-root

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-results
          path: ${{ runner.temp }}/go-test.json

  # Lints shell, workflows and Dockerfiles. The job keeps its first name,
  # since that name is the required check in .github/rulesets/main.json.
  shellcheck:
    concurrency:
      group: ci-${{ github.ref }}-shellcheck
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: v1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      # the shared workflow lint, at the sync tag that repo-sync calls
      WORKFLOW_LINT_REF: sync-v32
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install shellcheck
        run: bun run --silent ci:install-linter shellcheck

      - name: Install shfmt
        run: bun run --silent ci:install-linter shfmt

      - name: Install actionlint
        run: bun run --silent ci:install-linter actionlint

      - name: Install zizmor
        run: bun run --silent ci:install-linter zizmor

      - name: Install hadolint
        run: bun run --silent ci:install-linter hadolint

      - name: ShellCheck and shfmt
        run: scripts/ci/shellcheck.sh

      # also runs shellcheck over every run: block
      - name: actionlint
        run: actionlint

      - name: Checkout the workflow lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zgeoff/tools
          ref: ${{ env.WORKFLOW_LINT_REF }}
          path: .workflow-lint
          sparse-checkout: sync/pre-push
          persist-credentials: false

      # the rules of ci-design's Step scripts section; a public repo's profile
      # leaves out the heavy-check rule
      - name: Lint workflows
        env:
          CHECKS_PROFILE: public
        run: bun .workflow-lint/sync/pre-push/run-workflows-check.ts

      # GH_TOKEN turns on the audits that ask GitHub, such as known-vulnerable
      # actions and impostor commits
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github

      - name: hadolint
        run: hadolint host/Dockerfile images/base/Dockerfile images/examples/*/Dockerfile

      - name: Install
        run: bun install --frozen-lockfile

      # the shell that production code holds as text; plain `bun test` skips
      # these where shellcheck is missing, and here it is the pinned one
      - name: Embedded shell
        run: >-
          bun test -t shellcheck ./packages/api/src/protocols/login-shell.test.ts
          ./packages/mcp/src/tools/write-script.test.ts ./packages/cli/src/cli/completion.test.ts

  # Compiles the CLI for every platform, as a release does, and runs the
  # linux-x64 one. The release workflow runs each binary on its own platform;
  # macOS runners cost too much for every pull request.
  cli:
    concurrency:
      group: ci-${{ github.ref }}-cli
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:cli

      - name: Run
        run: dist/impz-linux-x64 --version

      # The release image compiles impd and the CLI in its own stage, with
      # its own install: build that stage too, so a dependency the stage
      # misses fails here and not first in a release.
      - name: Build the release compile stage
        run: docker build --target compile -f host/Dockerfile .

  # Packs @impz/client as the release publishes it, then installs the
  # tarball into an empty project on the oldest Node it supports, and smokes
  # it against impd's app under Node, Bun and a compiled Bun binary.
  # Then packs @impz/testing the same way and runs its smoke under bun test.
  client:
    concurrency:
      group: ci-${{ github.ref }}-client
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pack
        id: pack
        run: echo "tarball=$(scripts/release/pack-client.sh)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/release/check-client-package.sh "$TARBALL"

      - name: Smoke the package under Node, Bun and a compiled binary
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/release/check-client-runtimes.sh "$TARBALL"

      - name: Pack @impz/testing
        id: pack-testing
        run: echo "tarball=$(scripts/release/pack-testing.sh)" >> "$GITHUB_OUTPUT"

      - name: Check @impz/testing under bun test
        env:
          TARBALL: ${{ steps.pack-testing.outputs.tarball }}
          CLIENT: ${{ steps.pack.outputs.tarball }}
        run: scripts/release/check-testing-package.sh "$TARBALL" "$CLIENT"

  # Boots real microVMs: the fast end-to-end set in its four groups
  # (FAST_GROUPS in packages/e2e-harness/src/suites.ts, e2e/test-e2e.sh --group N),
  # each against a dev instance on its own runner's KVM. The `e2e` job below
  # is the required check over all four.
  e2e-group:
    concurrency:
      group: ci-${{ github.ref }}-e2e-${{ matrix.group }}
      cancel-in-progress: true
    name: e2e (group ${{ matrix.group }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 25
    strategy:
      # every group reports, so one failure does not hide another's
      fail-fast: false
      matrix:
        include:
          - group: 1
            host-tests: false
          # HOST_TESTS_GROUP in suites.ts: the host tests run once
          - group: 2
            host-tests: true
          - group: 3
            host-tests: false
          # the tailnet suites, on a Headscale that the harness starts
          - group: 4
            host-tests: false
    env:
      # the fast set at reduced size for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      # sparse, so only what the imps write takes disk
      IMP_STORAGE_GIB: 40
      # the tag e2e-build loads; one checkout per runner needs no tag of its own
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
      # PRs read the caches main writes; their own writes would only crowd
      # the repo's cache quota. One group writes on main, so four writers
      # never race on the same scopes
      WRITE_CACHE: ${{ github.event_name == 'push' && matrix.group == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # first, so a runner without KVM fails before any build
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the cpu suite fails in CI unless a private cgroup namespace gets the
      # cpu controller
      - name: Hand the cpu controller to containers
        run: bun run --silent ci:set-up-runner share-cpu

      # The ksm suite needs ksmd running, and skips on any host where it is
      # off. ubuntu-24.04 runs Linux 6.17, past the 6.10 IMP_KSM needs.
      - name: Turn KSM on for this runner
        run: bun run --silent ci:set-up-runner turn-on-ksm

      # The huge-pages suite runs in group 2 and skips on a host with no pool,
      # so only that runner gives up RAM to one.
      - name: Reserve huge pages for the huge-pages suite
        if: matrix.group == 2
        run: bun run --silent ci:set-up-runner reserve-huge-pages

      # CI must not pass --clean to the harness: it refuses to wipe a data dir
      # outside .data/ that holds no imp.xfs, and a fresh runner has nothing
      # to clean. The moves-tailnet suite's second host keeps its data beside
      # the instance's, in <data>-mv-b.
      - name: Pick the data dir
        run:
          bun run --silent ci:pick-data-dir --env IMP_DEV_DATA --mnt /mnt/imp-e2e --fallback
          "$GITHUB_WORKSPACE/.data/ci" --sibling=-mv-b

      - name: Install
        run: bun install --frozen-lockfile

      - name: Update the package lists
        if: matrix.host-tests
        run: sudo apt-get update

      - name: Install nftables
        if: matrix.host-tests
        run: sudo apt-get install -y --no-install-recommends nftables

      # The host tests (`bun run test:host`) as root: the real nft and
      # iptables in fresh namespaces, packets between veth pairs included.
      # Plain `bun test` skips them on runners that restrict unprivileged
      # namespaces; here a skip fails.
      - name: Host networking tests
        if: matrix.host-tests
        run: sudo env "PATH=$PATH" IMP_HOST_TESTS=required bun run test:host

      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: ${{ env.WRITE_CACHE }}

      # the registry suite trusts its registry's certificate in
      # /etc/docker/certs.d with sudo
      - name: Name the e2e registry
        run: bun run --silent ci:set-up-runner name-e2e-registry

      # No Tailscale secret here: the tailnet suites join the run's own
      # Headscale, and outside acceptance a missed timing limit only warns.
      - name: End-to-end tests
        env:
          GROUP: ${{ matrix.group }}
        run: e2e/test-e2e.sh --group "$GROUP"

      # The steps below also run after a failure or a timeout, with or
      # without a container, so none of them may fail the job.
      - name: Collect logs
        if: always()
        continue-on-error: true
        run: bun run --silent ci:collect-e2e-logs docker imp-dev

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.group }}
          # the dashboard suite's Playwright traces and screenshots
          path: |
            .cache/e2e/
            packages/dashboard/.test-results/
          if-no-files-found: ignore
          retention-days: 14

      # the runner is thrown away, so no sleeping imps to keep
      - name: Remove the dev instance
        if: always()
        continue-on-error: true
        run: docker rm -f imp-dev

  # The required check and release-please's gate: every e2e group passed. It
  # runs whatever they did, so a group that failed, was cancelled or was
  # skipped fails it, and never passes as a skip.
  e2e:
    concurrency:
      group: ci-${{ github.ref }}-e2e
      cancel-in-progress: true
    if: always()
    needs: [e2e-group]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every e2e group to pass
        env:
          RESULT: ${{ needs.e2e-group.result }}
        run: test "$RESULT" = success

  # The proof that an imp host runs with no Docker engine: e2e/podman/run-podman-proof.sh
  # starts the dev instance under Docker, masks the runner's Docker, starts it again
  # under rootful Podman on the same data dir, checks what survived, and runs the
  # socket and podman suites. Not a required check, and not in the e2e gate.
  podman:
    concurrency:
      group: ci-${{ github.ref }}-podman
      cancel-in-progress: true
    name: podman (no Docker)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores, and
    # impd builds its default image before the first imp
    timeout-minutes: 40
    env:
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      IMP_STORAGE_GIB: 40
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Pick the data dir
        run:
          bun run --silent ci:pick-data-dir --env IMP_DEV_DATA --mnt /mnt/imp-e2e --fallback
          "$GITHUB_WORKSPACE/.data/ci"

      - name: Install
        run: bun install --frozen-lockfile

      # the e2e groups write the caches; this job only reads them
      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: false

      - name: Install Podman
        run: bun run --silent ci:set-up-runner install-podman

      - name: Run the Podman proof
        run: sudo -E env "PATH=$PATH" e2e/podman/run-podman-proof.sh

      # The steps below also run after a failure or a timeout, with or
      # without a container, so none of them may fail the job.
      - name: Collect logs
        if: always()
        continue-on-error: true
        run: bun run --silent ci:collect-e2e-logs podman imp-dev

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-podman
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the dev instance
        if: always()
        continue-on-error: true
        run: sudo podman rm -f imp-dev

  # The ZFS storage backend on real pools, in three shards on three runners:
  # scripts/zfs-host-test.sh runs real imps on a pool in a sparse file, with
  # the zfs module Ubuntu's kernel ships, and prints the ZFS timings. Shards 1
  # and 2 split the ZFS lane: every *.zfs.e2e.ts journey, which runs nowhere
  # else, split by its suite's recorded time. The `suites` rows run VM e2e
  # suites on the ZFS backend, a backend matrix and not a lane, placed so the
  # shards end together. Shard 1 also runs scripts/test-zfs.sh on a throwaway
  # pool of its own. The `zfs` job below is the required check over all three.
  zfs-shard:
    concurrency:
      group: ci-${{ github.ref }}-zfs-${{ matrix.shard }}
      cancel-in-progress: true
    name: zfs (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 30
    strategy:
      # every shard reports, so one failure does not hide another's
      fail-fast: false
      matrix:
        include:
          # the moves suite's shard, the only one that builds the base image
          - shard: 1
            lane: 1/2
            suites: lifecycle,disks
            unit: true
          - shard: 2
            lane: 2/2
            unit: false
          # sleep and boot-templates share the e2e-ws image
          - shard: 3
            suites: checkpoints,sleep,boot-templates
            unit: false
    env:
      # as the e2e job: reduced sizes for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      # the tag e2e-build loads; one checkout per runner needs no tag of its own
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
      # zfs-host-test runs the lane share and the named suites a row sets
      IMP_ZFS_SHARD: ${{ matrix.lane }}
      IMP_ZFS_E2E_SUITES: ${{ matrix.suites }}
      IMP_ZFS_TEST_UNIT: 0
      # each shard has its runner to itself
      E2E_OWNS_ZFS_HOST: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Pick the work dir
        run:
          bun run --silent ci:pick-data-dir --env IMP_ZFS_TEST_DIR --mnt /mnt/imp-zfs --fallback
          "$RUNNER_TEMP/imp-zfs"

      - name: Install
        run: bun install --frozen-lockfile

      # the ARC capped at 1 GiB, as deploy/bootstrap.sh caps it, so the guests
      # keep their memory
      - name: Install ZFS
        run: bun run --silent ci:set-up-runner install-zfs 1073741824

      # the unit part runs here, in its own temp dir, so a failure names it
      - name: ZFS backend tests
        if: matrix.unit
        run: sudo env "PATH=$PATH" IMP_ZFS_TEST_DIR= scripts/test-zfs.sh

      # reads the caches only: e2e group 1 writes the same scopes on push, and
      # two writers at once can fail its build
      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: false

      - name: Imps on ZFS
        run: scripts/zfs-host-test.sh

      # also after a failed suite: the script writes the summary either way
      - name: Job summary
        if: always()
        run: bun run --silent ci:zfs-summary

      # also after a failure or a timeout, so none of these may fail the job
      - name: Collect logs
        if: always()
        continue-on-error: true
        run: bun run --silent ci:collect-e2e-logs docker imp-zfs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zfs-e2e-results-${{ matrix.shard }}
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # The required check: every zfs shard passed. It runs whatever they did, so a
  # shard that failed, was cancelled or was skipped fails it, and never passes
  # as a skip.
  zfs:
    concurrency:
      group: ci-${{ github.ref }}-zfs
      cancel-in-progress: true
    if: always()
    needs: [zfs-shard]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every zfs shard to pass
        env:
          RESULT: ${{ needs.zfs-shard.result }}
        run: test "$RESULT" = success

  # Main-only jobs go below with `if: github.event_name == 'push'` and
  # `needs:` on the gates above.

  # A release takes two runs of the release job (docs/runbooks/releasing.md),
  # through the shared release-please job in zgeoff/tools:
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR (version bump and changelog), the sync command makes it
  #   pass the checks job, and the job merges it once its checks pass
  # - the run that merges the release PR tags vX.Y.Z and creates the GitHub
  #   release at once, and the start-release job starts release.yml for the tag
  #
  # The release job waits for no gate: the release PR passed its own checks,
  # and the tag must land while the merge commit is still main's head, as
  # the release App's token cannot tag a commit behind a workflow change.
  #
  # The job runs only once a release App is configured (vars.RELEASE_APP_ID):
  # a release PR opened with GITHUB_TOKEN would get no CI, and the repo would
  # need Actions to be allowed to open PRs.
  release:
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@sync-v33
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: true
      # release-please names the branch for the root package's component
      release-branch: release-please--branches--main--components--impz
      # the release PR bumps versions that bun.lock records, and writes a
      # CHANGELOG.md that oxfmt reformats in one pass (.oxfmtrc.test.ts)
      sync-command: bun install && bun run format && bun run format:check
      # longer than any pull request job's timeout, with time for the runner
      # queue: a check still pending at the deadline leaves the release PR
      # open, unmerged, until the next push to main
      checks-timeout-minutes: 60
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # A run of its own, outside this workflow's concurrency group, so an
  # hour-long release never holds up CI on main, and impz's npm trusted
  # publishers keep naming release.yml. release.yml comes from main and checks
  # out the tag. A dispatch is the one GITHUB_TOKEN event that starts a
  # workflow.
  start-release:
    concurrency:
      group: start-release-${{ github.ref }}
      cancel-in-progress: false
    needs: [release]
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
