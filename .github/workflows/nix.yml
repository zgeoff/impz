name: Nix

# `nix flake check`: the NixOS module's eval check, and a NixOS VM that runs
# it on a ZFS pool with a stand-in image (docs/guides/nixos.md#test-it).
# eval and vm are required checks in .github/rulesets/main.json: rename both
# together. They run on every pull request, and skip their work, reporting
# success, unless the pull request changes a path that push lists below.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - package.json
      - deploy/**
      - host/scripts/tailscale-up.sh
      - host/scripts/load-env-file.sh
      - scripts/ci/check-kvm.sh
      - scripts/ci/set-up-runner.ts
      - .github/workflows/nix.yml

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the pull request changes the paths push lists; keep both lists
  # alike. This list adds the detector, so a change to it runs the work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Paths changed
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            flake.nix
            flake.lock
            package.json
            deploy/**
            host/scripts/tailscale-up.sh
            host/scripts/load-env-file.sh
            scripts/ci/check-kvm.sh
            scripts/ci/set-up-runner.ts
            .github/workflows/nix.yml
            .github/actions/paths-changed/**

  # The module's eval check and the format; no KVM. Only a 'false' skips it,
  # so a failed changes job runs the work rather than pass it.
  eval:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # nixfmt checks every .nix file under the folder it is given
      - name: Format
        run: nix fmt -- --check .

      - name: Eval check
        run: nix build -L --no-link .#checks.x86_64-linux.eval

  # The NixOS VM test. It needs /dev/kvm, and nested KVM inside the VMs.
  vm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # first, so a runner without KVM fails in seconds with the reason
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Open KVM to the builders
        run: bun run --silent ci:set-up-runner open-kvm-to-builders

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            system-features = kvm nixos-test

      - name: VM test
        run: nix build -L --no-link .#checks.x86_64-linux.vm
