name: Release

# Builds a release and publishes it (docs/runbooks/releasing.md): the host and base
# images to GHCR, the CLI binaries, the guest kernel, the system drive and
# SHA256SUMS to the GitHub release, the Homebrew formula to the tap, and
# @impz/client to npm, the last two once they are turned on.
#
# - Started by ci.yml's start-release job with the tag that the release job created.
# - Run by hand with a tag to republish an existing release. Every step is
#   safe to repeat: assets upload with --clobber, and `latest` moves only
#   when the tag is the newest release. The base job never pushes over an
#   existing tag, and skips a release from before its image.
# - Run by hand with no tag for a dry run of the current commit: it builds,
#   checks, pushes imp-host and imp-base as dryrun-<sha> and
#   attests them, but uploads nothing to a release and leaves `latest` alone.
#
# Nothing is pushed until every CLI binary has passed on its own platform.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and publish; empty for a dry run
        required: false
        type: string
        default: ''

permissions: {}

# one run per release; a second run for the same tag waits for the first
concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  LEFTHOOK: 0
  IMAGE: ghcr.io/${{ github.repository_owner }}/imp-host
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/imp-base

# Each job that runs a release script checks out the workflow's own commit,
# sparse, into .release-tools, and runs the script from there: a republish
# checks out an old tag, which may predate the scripts.
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      push_tag: ${{ steps.version.outputs.push_tag }}
    steps:
      # a republish builds the tag, never main's head
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: bun run --silent --cwd .release-tools release:plan-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # type=gha cache needs the runtime token and URL in the environment,
      # which only actions get by default
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # mode=max keeps the kernel layer, for the image job and the next
      # release
      - name: Build assets
        run:
          bun run --silent --cwd .release-tools release:tree-script build-release-assets.sh
          --cache-from type=gha,scope=system-files --cache-to type=gha,scope=system-files,mode=max

      - name: Upload assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Each CLI binary runs on its own platform; the assets job cross-compiled
  # them.
  smoke:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check the binary and its checksum
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: bun run --silent release:check-cli-binary

  # Builds the image from the same commit, with the kernel and the drive from
  # the assets job's cache, then checks the image's copies against
  # SHA256SUMS before anything is pushed.
  image:
    needs: [assets, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Loads into the runner's docker, so the image checked is the image
      # pushed.
      - name: Build image
        env:
          IMP_VERSION: ${{ needs.assets.outputs.version }}
          IMP_RELEASE_IMAGE: ${{ env.IMAGE }}
        run:
          bun run --silent --cwd .release-tools release:tree-script build-release.sh --cache-from
          type=gha,scope=system-files --cache-from type=gha,scope=imp-host --cache-to
          type=gha,scope=imp-host,mode=max

      - name: Check image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.assets.outputs.version }}
          VERSION: ${{ needs.assets.outputs.version }}
        run:
          bun run --silent --cwd .release-tools release:tree-script check-release-image.sh
          "$IMAGE_REF" "$VERSION" dist/SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        id: push
        env:
          BUILT_TAG: ${{ needs.assets.outputs.version }}
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
        run: bun run --silent --cwd .release-tools release:push-image

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # Publishes images/base as imp-base:<push_tag>, the base other images
  # build FROM by digest. A published tag never moves: when the tag exists,
  # as on a republish of a release that has its base or a second dry run of
  # one commit, the job leaves it alone and stays green. It skips a release
  # from before imp-base, and fails on an existing tag that has no
  # attestation. The concurrency group keeps two runs for one tag apart
  # between the plan and the push.
  # imp-base has no `latest`. Publish does not wait for this job: consumers
  # pin a digest, so a base failure must not hold up a release.
  base:
    needs: [assets, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # before the plan, so a missing tag answers "not found" rather than an
      # anonymous token error
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Decides, before any build, whether the job pushes or skips.
      - name: Plan
        id: plan
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bun run --silent --cwd .release-tools release:plan-base-image

      - name: Build image
        if: steps.plan.outputs.action == 'push'
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
          VERSION: ${{ needs.assets.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bun run --silent --cwd .release-tools release:build-base-image

      - name: Check image
        if: steps.plan.outputs.action == 'push'
        env:
          IMAGE_REF: ${{ env.BASE_IMAGE }}:${{ needs.assets.outputs.push_tag }}
        run:
          bun run --silent --cwd .release-tools release:tree-script check-base-image.sh "$IMAGE_REF"

      - name: Push image
        id: push
        if: steps.plan.outputs.action == 'push'
        env:
          IMAGE: ${{ env.BASE_IMAGE }}
          BUILT_TAG: ${{ needs.assets.outputs.push_tag }}
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
        run: bun run --silent --cwd .release-tools release:push-image

      - name: Attest image
        if: steps.plan.outputs.action == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [assets, image]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      # --clobber replaces what a failed run left behind
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Whether the tag is the newest release, and the move of the image's
  # `latest` when it is. Only the newest moves `latest`, the Homebrew formula
  # and npm's `latest`, so a republish of an older release moves none of them;
  # an operator may pin `latest` on purpose. After publish, so `latest` never
  # names an image whose release has no assets yet. Looked up once, so every
  # job that reads it agrees.
  #
  # The latest-tag group runs one such job at a time across release runs, and
  # queue: max keeps every waiting one, so a later run never cancels it.
  # actionlint 1.7.12 rejects the queue key, so .github/actionlint.yaml
  # ignores that error.
  latest:
    needs: [assets, publish]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: latest-tag
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    outputs:
      is_newest: ${{ steps.latest.outputs.is_newest }}
      newest_tag: ${{ steps.latest.outputs.newest_tag }}
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: bun run --silent release:tag-latest

  # Points the Homebrew formula at the release's binaries. The tap is a
  # second repository, so this needs the release App installed on it and the
  # Actions variable HOMEBREW_TAP naming it (docs/runbooks/releasing.md);
  # without either, the job is skipped. Only the newest release moves the
  # formula, so the job skips an older one, which the latest job reports.
  tap:
    needs: [assets, latest]
    if: >-
      inputs.tag != '' && vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != '' &&
      needs.latest.outputs.is_newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
          permission-contents: write

      - name: Update the formula
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: bun run --silent --cwd .release-tools release:update-formula

  # Packs and checks @impz/client and @impz/testing for npm, once the release
  # itself is out. Each is off until the owner sets its Actions variable,
  # NPM_PUBLISH_ENABLED or NPM_TESTING_PUBLISH_ENABLED, to true, after its first
  # publish by hand (docs/runbooks/releasing.md). Building runs here, without
  # the OIDC token; npm-publish only uploads the checked tarballs.
  npm-pack:
    needs: [assets, latest]
    if: inputs.tag != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      client_tarball: ${{ steps.pack.outputs.client_tarball }}
      testing_tarball: ${{ steps.pack.outputs.testing_tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/lib
            scripts/release
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Plan
        id: plan
        env:
          VERSION: ${{ needs.assets.outputs.version }}
          IS_NEWEST: ${{ needs.latest.outputs.is_newest }}
          TESTING_ENABLED: ${{ vars.NPM_TESTING_PUBLISH_ENABLED }}
        run: bun run --silent --cwd .release-tools release:plan-npm

      - name: Setup Node
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        if: steps.plan.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Pack and check
        id: pack
        if: steps.plan.outputs.publish == 'true'
        env:
          CLIENT: ${{ steps.plan.outputs.client }}
          TESTING: ${{ steps.plan.outputs.testing }}
        run: bun run --silent --cwd .release-tools release:pack-npm

      - name: Upload tarballs
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: npm-tarball/
          if-no-files-found: error
          retention-days: 7

  # The only job with the OIDC token: no checkout, no install, no build.
  npm-publish:
    needs: npm-pack
    if: needs.npm-pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # npm publishes, not bun: trusted publishing needs npm 11.5.1 or later
      # (Node 24 bundles it), and bun publish has no OIDC support
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm-tarball

      # ./ keeps npm from reading dir/file.tgz as a GitHub user/repo. The
      # client goes first, because @impz/testing depends on it.
      - name: Publish @impz/client
        if: needs.npm-pack.outputs.client_tarball != ''
        env:
          DIST_TAG: ${{ needs.npm-pack.outputs.dist_tag }}
          TARBALL: ./npm-tarball/${{ needs.npm-pack.outputs.client_tarball }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"

      - name: Publish @impz/testing
        if: needs.npm-pack.outputs.testing_tarball != ''
        env:
          DIST_TAG: ${{ needs.npm-pack.outputs.dist_tag }}
          TARBALL: ./npm-tarball/${{ needs.npm-pack.outputs.testing_tarball }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"
