name: bench

# `impz bench` on a KVM runner, against a dev instance. A push to a bench/**
# branch compares its head with the head's parent, and a dispatch compares its
# ref with a baseline ref. Both sides run on the one runner, their rounds taken
# in turn, and the job summary holds the table. A bench/**
# branch whose name holds huge-pages runs on 2 MiB pages. No pull request runs
# it, because a compare outlasts the release wait on a pull request's checks.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: the ref to compare against
        default: main
      scenarios:
        description: impz bench scenarios, comma-separated
        default: create,wake,restore
      concurrency:
        description: impz bench --concurrency
        default: 1,4,16,64
      samples:
        description: impz bench --samples
        default: '20'
      rounds:
        description: how many times each side runs
        default: '2'
      huge-pages:
        description: back the imps with 2 MiB pages
        type: boolean
        default: false
  push:
    branches:
      - bench/**

permissions: {}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never commits, but skip hook install/execution regardless
  LEFTHOOK: 0

jobs:
  bench:
    name: bench
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # two rounds of create, wake and restore at 1, 4, 16 and 64 on each side
    # take about an hour, and a kernel cache miss adds about 10 minutes
    timeout-minutes: 120
    env:
      # a 12 GiB budget holds fewer than 64 awake imps of 256 MiB, so the
      # governor's refusals show at 64; impd runs without KSM, whose scans
      # would add to the noise
      IMP_RAM_BUDGET_MIB: 12288
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      IMP_STORAGE_GIB: 60
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
      IS_HUGE_PAGES: ${{ inputs.huge-pages || contains(github.ref_name, 'huge-pages') }}
      IMP_HUGE_PAGES:
        ${{ (inputs.huge-pages || contains(github.ref_name, 'huge-pages')) && '2M' || 'off' }}
      SCENARIOS: ${{ inputs.scenarios || 'create,wake,restore' }}
      CONCURRENCY: ${{ inputs.concurrency || '1,4,16,64' }}
      SAMPLES: ${{ inputs.samples || '20' }}
      ROUNDS: ${{ inputs.rounds || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # a bench/** branch holds the change on top of its parent, so the parent
      # is the side without it
      - name: Pick the baseline
        id: baseline
        env:
          BASELINE_INPUT: ${{ inputs.baseline }}
        run: echo "ref=${BASELINE_INPUT:-$(git rev-parse HEAD~1)}" >> "$GITHUB_OUTPUT"

      - name: Checkout the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: .cache/baseline
          persist-credentials: false

      # first, so a runner without KVM fails before any build
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # 6 GiB of 2 MiB pages: 16 imps of 256 MiB awake at once, and a
      # template build beside them
      - name: Reserve huge pages
        if: env.IS_HUGE_PAGES == 'true'
        run: bun run --silent ci:set-up-runner reserve-huge-pages 3072

      - name: Pick the data dir
        run:
          bun run --silent ci:pick-data-dir --env IMP_DEV_DATA --mnt /mnt/imp-bench --fallback
          "$GITHUB_WORKSPACE/.data/ci"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install the baseline
        working-directory: .cache/baseline
        run: bun install --frozen-lockfile

      # reads the caches that CI's e2e group 1 writes on main
      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: false

      # the baseline's own guest agent and system drive, from the same cache
      - name: Build the baseline's kernel and system drive
        working-directory: .cache/baseline
        run: >-
          docker buildx build -f host/Dockerfile --target system-files --platform linux/amd64
          --output type=local,dest=.cache/ci --cache-from type=gha,scope=system-files .

      - name: Measure touched pages
        if: env.IS_HUGE_PAGES == 'true'
        run: bun run --silent ci:touched-pages-bench

      - name: Compare with the baseline
        run: >-
          bun scripts/bench/run-bench-arms.ts --out .cache/bench --rounds "$ROUNDS" --arm
          "baseline=.cache/baseline" --arm candidate=. -- "$SCENARIOS" --concurrency "$CONCURRENCY"
          --samples "$SAMPLES" --memory 256m

      # The steps below also run after a failure or a timeout, with or
      # without a container, so none of them may fail the job.
      - name: Collect logs
        if: always()
        run: bun run --silent ci:collect-e2e-logs docker imp-dev .cache/bench

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: .cache/bench/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the dev instance
        if: always()
        continue-on-error: true
        run: docker rm -f imp-dev
