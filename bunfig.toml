[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one impz
# uses needs an entry here, or bun install refuses the bump.
# fast-uri 3.1.9 (published 2026-10-19, patches GHSA-w74x-v6f9-j3xg + GHSA-xhq7-xmqj-769h + GHSA-wjr9-j795-jxcr + GHSA-333x-w4r6-6crp) ages past the gate ~2026-10-26 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@zgeoff/bun-test-extended",
  "@zgeoff/bun-test-react",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  # tsrs 0.18.0 and its native packages skip the gate so typecheck can move to
  # it now; these entries come out on 2026-10-26, once tsrs 0.18.0 is 7 days old
  "tsrs",
  "@tsrs/darwin-arm64",
  "@tsrs/linux-arm64-gnu",
  "@tsrs/linux-arm64-musl",
  "@tsrs/linux-x64-gnu",
  "@tsrs/linux-x64-musl",
  "fast-uri",
]

[test]
# restores env overrides, seeds faker and runs the MSW server for every test
# (packages/test-utils), then registers jest-extended matchers
preload = ["./packages/test-utils/src/preload.ts", "@zgeoff/bun-test-extended"]

# the dashboard's component tests need a DOM, which must not leak into the
# daemon's tests; they run from their package (bun run test:dashboard). A lane
# file names its real system in its suffix and runs only in its lane's script
# (test:host, test:headscale, test:pebble), which replaces this list.
pathIgnorePatterns = [
  "packages/dashboard/**",
  "**/*.host.test.ts",
  "**/*.headscale.test.ts",
  "**/*.pebble.test.ts",
]
