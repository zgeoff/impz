[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# @maschwenk/tsrslint 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-linux-x64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-linux-arm64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# @maschwenk/tsrslint-darwin-arm64 0.1.6 (published 2026-10-26) ages past the gate ~2026-11-02 — remove then
# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one impz
# uses needs an entry here, or bun install refuses the bump.
# follow-redirects 1.16.2 (published 2026-10-25, patches GHSA-mrwp-f3q8-3g9p) ages past the gate ~2026-11-01 — remove then (audit-fix)
# node-forge 1.4.1 (published 2026-10-27, patches GHSA-86w9-cpqp-85rv + GHSA-8hrf-8g6f-7xwp + GHSA-hqq3-7jhf-c5jx + GHSA-5x38-2vff-x55p + GHSA-4642-5mcj-2rqw + GHSA-6wvx-3r32-xmcg + GHSA-525v-9gp9-w22h + GHSA-7wch-p9px-956x + GHSA-h6cr-wjv9-3cpp + GHSA-4487-j8r4-4g2f + GHSA-5cwg-6vw7-rj6p + GHSA-jc66-7q78-782g) ages past the gate ~2026-11-03 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/bun-test-react",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@maschwenk/tsrslint",
  "@maschwenk/tsrslint-linux-x64",
  "@maschwenk/tsrslint-linux-arm64",
  "@maschwenk/tsrslint-darwin-arm64",
  "follow-redirects",
  "node-forge",
]

[test]
# restores env overrides, seeds faker and runs the MSW server for every test
# (packages/test-utils), then registers jest-extended matchers
preload = ["./packages/test-utils/src/preload.ts", "@zgeoff/bun-test-extended"]

# a leak between tests or files that a fixed order hides fails the run, which
# prints the --seed that repeats the order; CI's unit step runs bun test itself
randomize = true

# the dashboard's component tests need a DOM, which must not leak into the
# daemon's tests; they run from their package (bun run test:dashboard). A lane
# file names its real system in its suffix and runs only in its lane's script
# (test:host, test:headscale, test:pebble, test:docker, test:small-fs), which
# replaces this list.
pathIgnorePatterns = [
  "packages/dashboard/**",
  "**/*.host.test.ts",
  "**/*.headscale.test.ts",
  "**/*.pebble.test.ts",
  "**/*.docker.test.ts",
  "**/*.small-fs.test.ts",
]
