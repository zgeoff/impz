[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one impz
# uses needs an entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/bun-test-react",
  "@zgeoff/chex",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
]

[test]
# restores env overrides, seeds faker and runs the MSW server for every test
# (packages/shared/src/test-utils), then registers jest-extended matchers
preload = ["./packages/shared/src/test-utils/preload.ts", "@zgeoff/bun-test-extended"]

# a leak between tests or files that a fixed order hides fails the run, which
# prints the --seed that repeats the order; CI's unit step runs bun test itself
randomize = true

# the dashboard's component tests need a DOM, which must not leak into the
# daemon's tests; they run from their package (bun run test:dashboard). An
# e2e/ folder needs a dev instance, and scripts/test-e2e.sh runs it. A lane
# file names its real system in its suffix and runs only in its lane's script
# (test:host, test:headscale, test:pebble, test:docker, test:small-fs), which
# replaces this list.
pathIgnorePatterns = [
  "packages/dashboard/**",
  "packages/*/e2e/**",
  "**/*.host.test.ts",
  "**/*.headscale.test.ts",
  "**/*.pebble.test.ts",
  "**/*.docker.test.ts",
  "**/*.small-fs.test.ts",
]
